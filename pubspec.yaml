name: sahti
description: "Scan de produits alimentaires au Maroc Ni publicité, ni marques qui paient pour leur note.."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Readex Pro (licence SIL OFL 1.1, voir assets/fonts/OFL.txt) : latin + arabe
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
